name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG icons from base64 sidecars
        run: |
          mkdir -p icons
          for s in 180 192 512; do
            base64 -d "icons/icon-${s}.png.b64" > "icons/icon-${s}.png"
          done
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css routine.js sw.js manifest.webmanifest _site/
          cp -r icons _site/icons
          rm -f _site/icons/*.b64 _site/icons/*.svg
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
